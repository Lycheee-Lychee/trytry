# Docker Desktop / WSL2 override: containers reach the WSL-hosted model
# server through Docker Desktop's stable host alias.
server:
  url: "ws://host.docker.internal:8000"
  # First inference on a fresh RTX 5090 process can include CUDA kernel
  # initialization/compilation and exceeded the harness's 30 s default.
  timeout: 180

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    episodes_per_task: 1
    max_tasks: 1
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
