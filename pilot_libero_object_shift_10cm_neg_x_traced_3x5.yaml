# Re-run −x 10 cm object-only with pose traces (on_plate / distances).
server:
  url: "ws://host.docker.internal:8000"
  timeout: 180

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest
  volumes:
    - "/home/lychee/research/vla-evaluation-harness/src/vla_eval/benchmarks/libero/object_shift.py:/workspace/src/vla_eval/benchmarks/libero/object_shift.py:ro"

output_dir: "./results/pilot_libero_object_shift_10cm_neg_x_traced2_3x5"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.object_shift:LIBEROObjectShiftBenchmark"
    name: "pi05_libero_spatial_objshift_10cm_neg_x_traced2"
    episodes_per_task: 5
    max_tasks: 3
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
      object_shift_cm: -10
      object_shift_axis: x
      send_state: true
      send_wrist_image: true
    recording:
      record_video: true
      video_fps: 10
